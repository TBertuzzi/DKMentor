name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  package-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate repository metadata and package policy
        run: python3 scripts/validate.py
      - name: Install Lua 5.1
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.1
      - name: Syntax check addon Lua
        run: luac5.1 -p Localization.lua Data.lua Builds.lua Guides.lua Codex.lua Voices.lua Core.lua
      - name: DK Codex smoke test
        run: lua5.1 tests/codex_smoke.lua
      - name: Package and publish
        uses: BigWigsMods/packager@v2
        env:
          GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
