name: Validate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate repository metadata and package policy
        run: python3 scripts/validate.py
      - name: Install Lua 5.1
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.1
      - name: Syntax check addon Lua
        run: luac5.1 -p Localization.lua Data.lua Builds.lua Guides.lua Codex.lua Voices.lua Core.lua
      - name: DK Codex smoke test
        run: lua5.1 tests/codex_smoke.lua
      - name: Build manual CurseForge package
        run: bash scripts/package.sh
      - name: Verify archive
        run: unzip -t release/DKMentor-v*-CurseForge.zip
